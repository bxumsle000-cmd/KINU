# ============================================================================
# 第一次跑 / 換一台新電腦
#     docker compose up -d
#     然後 IDEA 按 Run
#
# 整組砍掉重來（會清空資料庫所有資料）
#     docker compose down -v
#     docker compose up -d
#     然後 IDEA 按 Run
#
# 用 DBeaver / pgAdmin 連進容器裡的資料庫（PostgreSQL）
#     Host：localhost   Port：15432
#     Database：unicloth
#     Username：unicloth
#     Password：見下方 Eeit25@Unicloth
# ============================================================================

# 固定專案名稱：不管從哪個資料夾（Unicloth、Unicloth-cash…）執行，都是同一組容器，
# 不會因為資料夾名稱不同而去建第二個 unicloth-db，造成名稱衝突
name: unicloth

services:
  # --------------------------------------------------------------------------
  # 資料庫：PostgreSQL 17
  #
  # POSTGRES_DB 會在第一次啟動時自動建好 unicloth 資料庫，
  # 資料表再由 Spring Boot 啟動時的 Flyway 建立（db/migration/V1__init.sql）。
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17
    # 容器名稱是「整台電腦共用」的，不分專案，所以一定要跟其他專案錯開。
    container_name: unicloth-postgres
    # 左邊是你電腦的埠號，右邊是容器內的（Postgres 預設 5432；用 15432 避免跟電腦上其他 Postgres 衝突）
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: "unicloth"
      POSTGRES_USER: "unicloth"
      POSTGRES_PASSWORD: "Eeit25@Unicloth"
    volumes:
      - pg-data:/var/lib/postgresql/data   # 具名 volume，資料才不會隨容器消失
    restart: unless-stopped
    healthcheck:
      # 讓 compose 知道「資料庫真的可以接受連線了」，不然 analytics 會太早啟動而連不上
      test: ["CMD-SHELL", "pg_isready -U unicloth -d unicloth"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --------------------------------------------------------------------------
  # 綠界付款通知用的 HTTPS 網址（Cloudflare Quick Tunnel）
  #
  # 綠界的伺服器連不到你電腦的 localhost，所以用 tunnel 開一個對外網址，
  # 轉到你電腦上的 ecpay-callback-proxy.cjs（8787），再由它轉給 Spring Boot（8080）。
  # 不用自己安裝 cloudflared。
  #
  # 網址每次啟動都會變，但不用手動設定：
  # Spring Boot 每次建立付款都會問 tunnel 目前的網址（EcpayReturnUrlResolver）。
  # 想自己看網址：docker compose logs tunnel
  # --------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    container_name: unicloth-tunnel
    # host.docker.internal = 你自己的電腦（從容器裡看出去）
    # --metrics：開查詢介面，http://127.0.0.1:20241/quicktunnel 會回傳目前網址
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://host.docker.internal:8787
    ports:
      - "127.0.0.1:20241:20241"   # 只開給本機，外面連不到
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 的 Docker 沒有內建這個名稱，加上才通用
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 銷售分析服務（Python，analytics/main.py）
  #
  # 行銷後台「銷售數據」的數字由它計算：React → Spring Boot（擋權限）→ 這裡。
  # 第一次會先建映像檔（下載 Python 和套件，要一點時間）。
  # 改了 analytics/ 的程式要重建才會生效：docker compose up -d --build analytics
  # --------------------------------------------------------------------------
  analytics:
    build: ./analytics
    container_name: unicloth-analytics
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANALYTICS_HOST: "0.0.0.0"       # 容器裡要聽 0.0.0.0，下面的 ports 才轉得進來
      DB_HOST: "postgres"             # 容器之間用服務名稱連，不是 localhost
      DB_PORT: "5432"                 # 容器內的埠號，不是你電腦的 15432
      DB_PASSWORD: "Eeit25@Unicloth"
    ports:
      - "127.0.0.1:8000:8000"         # 只開給本機，Spring Boot 用 http://127.0.0.1:8000 連
    restart: unless-stopped

volumes:
  pg-data: